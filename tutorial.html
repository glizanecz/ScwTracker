<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScwTracker Tutorial</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <style>
        body {
            display: grid;
            place-items: center;
            background-color: dimgrey;
            min-height: 100dvh;
            padding: 12px;
            box-sizing: border-box;
            margin: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .background {
            background-color: rgb(177, 176, 176);
            padding: 20px;
            width: min(600px, 100%);
            box-sizing: border-box;
            text-align: center;
            display: grid;
            place-items: center;
            border-radius: 10px;
            border-color: black;
        }

        input {
            background-color: rgb(51, 51, 51);
            border-radius: 5px;
            border-color: black;
            color: white;
            box-sizing: border-box;
            max-width: 100%;
        }

        .sbmt {
            background-color: rgb(51, 51, 51);
            border-radius: 5px;
            border-color: black;   
            color: white; 
        }

        .sbmt::hover {
            background-color: rgb(131, 131, 131);
            border-radius: 5px;
            border-color: black;    
        }
    </style>
</head>
<body>
    <div class="background">
        <h2>Confused? Don't worry!</h2>
        <p>To create your first task, click the plus button at the top right of your screen!</p>
    </div>
    <script type="module">

    </script>
</body>
</html>
