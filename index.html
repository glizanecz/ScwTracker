<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScwTracker</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <style>
        body {
            display: grid;
            place-items: center;
            background-color: dimgrey;
        }

        .background {
            background-color: rgb(177, 176, 176);
            padding: 20px;
            width: fit-content;
            height: fit-content;
            display: grid;
            place-items: center;
            border-radius: 10px;
            border-color: black;
        }

        input {
            background-color: rgb(51, 51, 51);
            border-radius: 5px;
            border-color: black;
        }

        .sbmt {
            background-color: rgb(51, 51, 51);
            border-radius: 5px;
            border-color: black;    
        }

        .sbmt::hover {
            background-color: rgb(131, 131, 131);
            border-radius: 5px;
            border-color: black;    
        }
    </style>
</head>
<body>
    <div class="background">
        <h1> Welcome to ScwTracker! </h1>
        <h3> A Lightweight task tracker for students, employees, and busy parents alike!</h3>
        <label for="password">Password:</label><input id="password" type="password" maxlength="15">
        <br>
        <label for="username">Username:</label><input id="username" type="text" maxlength="12">
        <br>
        <button class="sbmt">Submit Login Info</button>
    </div>
    <script type="module">
        // Your JavaScript goes here
    </script>
</body>
</html>
