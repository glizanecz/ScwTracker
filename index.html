<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScwTracker</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <style>
        body {
            display: grid;
            place-items: center;
            background-color: dimgrey;
            min-height: 100dvh;
            padding: 12px;
            box-sizing: border-box;
            margin: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .background {
            background-color: rgb(177, 176, 176);
            padding: 20px;
            width: 100%;
            height: 100%;
            max-height: calc(100% - 30px);
            max-width: calc(100% - 30px);
            box-sizing: border-box;
            text-align: center;
            display: grid;
            place-items: center;
            border-radius: 10px;
            border-color: black;
            column-gap: 10px;
        }

        input {
            background-color: rgb(51, 51, 51);
            border-radius: 5px;
            border-color: black;
            color: white;
            box-sizing: border-box;
            max-width: 100%;
        }

        .sbmt {
            background-color: rgb(51, 51, 51);
            border-radius: 5px;
            border-color: black;   
            color: white; 
        }

        .sbmt::hover {
            background-color: rgb(131, 131, 131);
            border-radius: 5px;
            border-color: black;    
        }
        
        textarea::placeholder {
            color: black;
        }

        textarea {
            width: 100%;
            height: 100%;
            max-height: calc(100% - 20px);
            max-width: calc(100% - 10px);
            min-height: fit-content;
            min-width: fit-content;
            box-sizing: border-box; 
            display: flex;
            background-color: grey; 
            font: black;
            resize: none;
        }
    </style>
</head>
<body>
    <div id="loginMenuBack" class="background">
        <h1> Welcome to ScwTracker! </h1>
        <h3> A Lightweight task tracker for students, employees, and busy parents alike!</h3>
        <br>
        <label for="username">Email:</label><input id="username" type="text" minlength="11" maxlength="35">
        <br>
        <label for="password">Password:</label><input id="password" type="password" minlength="6" maxlength="20">
        <br>
        <button id="loginBtn" class="sbmt">Login...</button> 
        <br>
        <button id="signUpBtn" class="sbmt">Or Sign Up...</button>

        <h6> ScwTracker | Copyright 2026 ⓒ </h6>
    </div>
    <div id="signUpWelcome" class="background">
        <h1>Welcome to ScwTracker!</h1>
        <h2>If you need introductions, go to our <a target="_blank" rel="noopener noreferrer" href="https://glizanecz.github.io/ScwTracker/tutorial.html">tutorial page</a>!!</h2>
        <label for="userNickname">Set a nickname or have one auto generated!</label>
        <br>
        <input id="userNickname">
        <br>
        <button id="goToMainBtn">Dive right in!</button>
    </div>
    <div id="mainUserMenu" class="background">
        <h1 id="userWelcome">Hello!</h1>
        <h2>View all your tasks below!</h2>
        <textarea readonly placeholder="You currently don't have any tasks, get started by pressing the button..." id="taskList"></textarea>
        <br>
        <button id="addTaskBtn">Add A Task!</button>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            increment,
            serverTimestamp,
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";  

        const firebaseConfig = {
            apiKey: "AIzaSyDR4uhiy7JQXSv0KV5VYbFpAOPK4fxSUls",
            authDomain: "scwtrack-7d301.firebaseapp.com",
            databaseURL: "https://scwtrack-7d301-default-rtdb.firebaseio.com",
            projectId: "scwtrack-7d301",
            storageBucket: "scwtrack-7d301.firebasestorage.app",
            messagingSenderId: "211365189850",
            appId: "1:211365189850:web:94d0607c4636d415d06de3",
            measurementId: "G-SVYCRR65TK"
        };


        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        //Sections
        const loginMenuBack = document.getElementById("loginMenuBack");
        const signUpWelcome = document.getElementById("signUpWelcome");
        signUpWelcome.style.display = "none";
        const mainUserMenu = document.getElementById("mainUserMenu");
        mainUserMenu.style.display = "none";
        //Elements for sign up & login
        const usernameEl = document.getElementById("username");
        const passwordEl = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const signUpBtn = document.getElementById("signUpBtn");
        //Elements for sign up welcome
        const userNicknameInp = document.getElementById("userNickname");
        const goToMainBtn = document.getElementById("goToMainBtn");
        //Elements for main user menu
        const userWelcome = document.getElementById("userWelcome");
        const taskList = document.getElementById("taskList");
        const addTaskBtn = document.getElementById("addTaskBtn");

        //Variables for whole project
        let username = "somethin"
        let tasks = 0;
        let uuid = null;
        //Variables for sign up & login
        let usernameInp = null;
        let passwordInp = null;
        //Variables for welcome sign up



        loginBtn.onclick = async function () { 
            usernameInp = usernameEl.value;
            passwordInp = passwordEl.value;

            const response = await login();

            if (response === "signedin") {
                loginMenuBack.style.display = "none";
                mainUserMenu.style.display = "grid";    
            } else {
                console.log("Couldn't login!")
            }
        }

        signUpBtn.onclick = async function () { 
            usernameInp = usernameEl.value;
            passwordInp = passwordEl.value;

            const response = await signUp();

            if (response === "created") {
                loginMenuBack.style.display = "none";
                signUpWelcome.style.display = "grid";    
            } else {
                console.log("Couldn't sign up!")
            }
        }

        goToMainBtn.onclick = async function () {
            signUpWelcome.style.display = "none";
            mainUserMenu.style.display = "grid";
            username = userNicknameInp.value;
            userWelcome.innerText = "Hello " + username + "!";
            await setUserBasicsData()
        }

        async function signUp() {
            try {
                const credential = await createUserWithEmailAndPassword(auth, usernameInp, passwordInp);
                uuid = credential.user.uid;
                return "created"
            } catch (error) {
                console.error(error);
                throw error;
            }
        }

        async function login() {
            try {
                const credential = await signInWithEmailAndPassword(auth, usernameInp, passwordInp);
                uuid = credential.user.uid;
                return "signedin"
            } catch (error) {
                console.error(error);
                throw error;
            }
        }




        async function loadUserData() {
            try {
                const snap = await getDoc(doc(db, "users", uuid, "userData", "basics"));
                if (snap.exists()) {
                    const data = snap.data();
                    username = data.username;
                    userWelcome.innerText = "Hello " + username + "!";
                    tasks = data.tasks;
                }
            } catch (error) {
                console.log("User data couldn't be loaded!")
                console.error(error);
            }
        }

        async function setUserBasicsData() {
            try {
                console.log("UUID:", uuid);
                console.log("Saving:", username);
                await setDoc(doc(db, "users", uuid, "userData", "basics"), {
                    username: username,
                    tasks: 0
                })
                console.log("Saved!");
            } catch (error) {
                console.log("Data didn't set!")
                console.error(error);
                console.error(error.code);
                console.error(error.message);
            }
        }
    </script>
</body>
</html>
