        function startProjectListener() {
            if (projectListenerUnsubscribe) {
                projectListenerUnsubscribe();
            }

                collection(db, "users", uuid, "projects"),
                (snapshot) => {
                    taskCollection = [];
                    taskVisualList = [];
                    tasks = snapshot.size;
                    taskList.innerHTML = "";

                    snapshot.forEach((doc) => {
                        const project = doc.data();

                        taskCollection.push(project);
                        taskVisualList.push(project.projName);
                    });
                    getTotalTasks()
                    projectsTemporary = [...taskCollection];
                    displayList(taskCollection, priorityMethod);
                }
            );
        }
