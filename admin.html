<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeWiz V1.1.1</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="testing.css">
</head>
<body>
    <div class="LogSignBack">
        <label for="username">Email:</label>
        <br>
        <input class="loginInput" id="username" type="text" minlength="11" maxlength="35">
        <br>
        <label for="password">Password:</label>
        <br>
        <input class="loginInput"  id="password" type="password" minlength="6" maxlength="20">
        <br>
        <button id="loginBtn" class="sbmt">Login...</button> 
        <br>
        <button id="signUpBtn" class="sbmt">Or Sign Up...</button>
    </div>
    <div class="background">
        <h1>Name of Report</h1>
        <h1 class="loggedInput" placeholder="Report Name Here..."></h1>
        <h2>Report Description</h2>
        <p class="loggedInput" placeholder="Report Description Here..."></p>
        <h4>Reported UUID</h4> 
        <h5 class="loggedInput"placeholder="Reported UUID Here..."></h5>
        <h4>Reporter UUID</h4>
        <h5 class="loggedInput" placeholder="Reporter UUID Here..."></h5>
        <button>Ban Reported</button> <button>Warn Reported</button> <button>Ignore Report</button> <button>Request Further Info</button>
    </div>

    <script type="module">

    </script>

</body>
</html>
