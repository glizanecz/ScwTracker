<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeWiz V1.1.1</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="testing.css">
</head>
<body>
    <h1 id="placeholderText">Insufficient Permissions...</h1>
    <div id="reportMenu" class="background">
        <h1>Name of Report</h1>
        <h1 id="reportName" class="loggedInput" placeholder="Report Name Here..."></h1>
        <h2>Report Description</h2>
        <p id="reportDesc" class="loggedInput" placeholder="Report Description Here..."></p>
        <h4>Reported UUID</h4> 
        <h5 id="reportedUUID" class="loggedInput"placeholder="Reported UUID Here..."></h5>
        <h4>Reporter UUID</h4>
        <h5 id="reporterUUID" class="loggedInput" placeholder="Reporter UUID Here..."></h5>
        <button class="loggedButtons" id="banUser">Ban Reported</button> <button class="loggedButtons" id="warnUser">Warn Reported</button> <button class="loggedButtons" id="ignoreRep">Ignore Report</button>
    </div>

    <script type="module">
        const placeholderText = document.getElementById("placeholderText");
        const reportMenu = document.getElementById("reportMenu");
        reportMenu.style.display = "none";
        const reportName = document.getElementById("reportName");
        const reportDesc = document.getElementById("reportDesc");
        const reportedUUID = document.getElementById("reportedUUID");
        const reporterUUID = document.getElementById("reporterUUID");
        const banUser = document.getElementById("banUser");
        const warnUser = document.getElementById("warnUser");
        const ignoreRep = document.getElementById("ignoreRep");
        let uuid = null;
        let reportObjects = [];
        let currentReport = 0;
        let stillAwaitingAnswer = true;
        let bans = [];
        let warns = [];
        let requestsForInfo = [];
        let clickOption = ""

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            deleteDoc,
            setDoc,
            updateDoc,
            increment,
            serverTimestamp,
            collection,
            query,
            where,
            collectionGroup,
            getDocs,
            onSnapshot,
            writeBatch,
            arrayUnion,
            arrayRemove,
            limit,
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";  

        const firebaseConfig = {
            apiKey: "AIzaSyDR4uhiy7JQXSv0KV5VYbFpAOPK4fxSUls",
            authDomain: "scwtrack-7d301.firebaseapp.com",
            databaseURL: "https://scwtrack-7d301-default-rtdb.firebaseio.com",
            projectId: "scwtrack-7d301",
            storageBucket: "scwtrack-7d301.firebasestorage.app",
            messagingSenderId: "211365189850",
            appId: "1:211365189850:web:94d0607c4636d415d06de3",
            measurementId: "G-SVYCRR65TK"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                uuid = user.uid;
                try {
                    const data = await getDoc(doc(db, "adminCheck", "Check"))
                    reportMenu.style.display = "grid";
                    placeholderText.style.display = "none";
                } catch (error) {
                    console.error(error.message)
                }
                await startViewing()
            } else {
                uuid = null;
            }
        })

        async function startViewing() {
            reportObjects = [];
            currentReport = 0;
            try {
                const colRef = collection(db, "reports");
                const q = query(colRef, limit(20));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    reportObjects.push({id: doc.id, ...doc.data()})
                })
                let batch = writeBatch(db);
                while (reportObjects.length > currentReport) {
                    stillAwaitingAnswer = true;
                    const reportInfo = reportObjects[currentReport];
                    reportName.innerText = reportInfo.reportName
                    reportDesc.innerText = reportInfo.reportDesc
                    reportedUUID.innerText = reportInfo.reported
                    reporterUUID.innerText = reportInfo.reporter
                    while (stillAwaitingAnswer === true) {
                        await sleep(100)
                    }
                    if (clickOption === "warn") {
                        warns.push(reportInfo.reported)
                        batch.set(doc(db, "users", reportInfo.reported, "userData", "banData"), {
                            warns: increment(1)
                        }, { merge: true })
                        batch.delete(doc(db,"reports",reportInfo.id))
                    } else if (clickOption === "ban") {
                        bans.push(reportInfo.reported)
                        batch.set(doc(db, "users", reportInfo.reported, "userData", "banData"), {
                            banned: "true"
                        }, { merge: true })
                        batch.delete(doc(db, "reports", reportInfo.id))
                    } else if (clickOption === "ignore") {
                        batch.delete(doc(db, "reports", reportInfo.id))
                    }
                    currentReport++;
                }
                reportName.innerText = "Report Name Here...";
                reportDesc.innerText = "Report Description Here...";
                reportedUUID.innerText = "Reported UUID Here...";
                reporterUUID.innerText = "Reporter UUID Here...";
                let doubleCheck = prompt("Are you sure you want to submit this batch? (Yes or No)");
                if (doubleCheck === "yes" || doubleCheck === "Yes") {
                    let tripleCheck = prompt("Last chance... (Yes or No)")
                    if (tripleCheck === "yes" || tripleCheck === "Yes") {
                        await batch.commit()
                        await startViewing(); 
                    } else {
                        batch = writeBatch(db);
                        await startViewing(); 
                    }
                } else {
                    batch = writeBatch(db);
                    await startViewing(); 
                }   
            } catch (error) {
                console.error("Couldn't fetch reports! Error Reason: " + error.message);
            }  
        }

        banUser.onclick = function () {
            //put code for ban here
            stillAwaitingAnswer = false;
            clickOption = "ban"
        }

        warnUser.onclick = function () {
            //put code for warn here
            stillAwaitingAnswer = false;
            clickOption = "warn"
        }

        ignoreRep.onclick = function () {
            //put code for ignoring here
            stillAwaitingAnswer = false;
            clickOption = "ignore"
        }

        



    </script>

</body>
</html>
